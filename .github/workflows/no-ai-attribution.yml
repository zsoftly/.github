name: No AI attribution

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label, JSON array of labels, or JSON object with group and labels. Empty picks
          GitHub-hosted for public repos and the light check runners in zs-light-checks for
          private repos, which have few hosted minutes.
        type: string
        default: ''
      tools-ref:
        description: Ref of zsoftly/.github that holds the script. Callers stay on @main.
        type: string
        default: main

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ${{ inputs.runs-on != '' && fromJSON(inputs.runs-on) || (github.event.repository.private && fromJSON('{"group":"zs-light-checks","labels":["self-hosted","Linux","zsoftly-light"]}') || 'ubuntu-latest') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsoftly/.github
          ref: ${{ inputs.tools-ref }}
          sparse-checkout: scripts/no-ai-attribution
          persist-credentials: false
      - name: Check commits, title and description
        run: python3 scripts/no-ai-attribution/check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
